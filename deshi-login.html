<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>弟子ログイン - ミライ図</title>
  <style>
    body {
      margin: 0;
      font-family: "Noto Sans JP", sans-serif;
      background: #f0f4ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      width: 350px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #2a7de1;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #2a7de1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.9;
      transform: scale(1.03);
    }

    .back {
      margin-top: 20px;
      display: block;
      color: #555;
      text-decoration: none;
    }
  </style>
</head>
<body>

<div class="login-box">
  <h2>弟子ログイン</h2>

  <input type="text" id="email" placeholder="メールアドレスを入力">

  <button onclick="login()">ログインする</button>

  <a href="index.html" class="back">← トップページに戻る</a>
</div>

<script>
  function login() {
    const email = document.getElementById("email").value;

    if (email === "") {
      alert("メールアドレスを入力してください");
      return;
    }

    window.location.href = "deshi-home.html";
  }
</script>

</body>
</html>
