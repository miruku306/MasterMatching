<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>手動マッチング（弟子） - ミライ図</title>
  <style>
    body { margin:0; font-family:"Noto Sans JP",sans-serif; background:#eef3ff; }
    header { background:#2a7de1; color:white; padding:20px; text-align:center; font-size:24px; }
    .content { padding:20px; }
    .section {
      background:white; padding:20px; margin-bottom:20px;
      border-radius:12px; box-shadow:0 0 10px rgba(0,0,0,0.1);
    }
    select, input {
      width:100%; padding:12px; margin-bottom:15px;
      border-radius:8px; border:1px solid #ccc; font-size:16px;
    }
    .btn {
      padding:12px 20px; background:#2a7de1; color:white;
      border:none; border-radius:8px; cursor:pointer; font-size:18px;
    }
    .result {
      background:#fff; padding:15px; border-radius:10px;
      margin-bottom:15px; box-shadow:0 0 5px rgba(0,0,0,0.1);
    }
    .result button {
      margin-top:10px; padding:10px 15px; background:#2a7de1;
      color:white; border:none; border-radius:6px; cursor:pointer;
    }
  </style>
</head>
<body>

<header>手動マッチング（弟子）</header>

<div class="content">

  <div class="section">
    <h2>検索条件</h2>

    <select id="industry">
      <option value="">業界を選択</option>
      <option>伝統工芸</option>
      <option>農業</option>
      <option>漁業</option>
      <option>建築</option>
      <option>整備・修理</option>
      <option>飲食</option>
      <option>IT・デジタル</option>
    </select>

    <select id="skill">
      <option value="">技術レベル</option>
      <option>未経験</option>
      <option>初心者</option>
      <option>中級</option>
      <option>上級</option>
    </select>

    <button class="btn" onclick="search()">検索する</button>
  </div>

  <div class="section">
    <h2>検索結果</h2>
    <div id="results"></div>
  </div>

</div>

<script>
  function search() {
    const results = document.getElementById("results");
    results.innerHTML = "";

    const sample = [
      { name:"佐藤工房（木工）", level:"初心者OK", area:"新潟市" },
      { name:"田中酒造（酒蔵）", level:"未経験OK", area:"長岡市" }
    ];

    sample.forEach(s => {
      const div = document.createElement("div");
      div.className = "result";
      div.innerHTML = `
        <h3>${s.name}</h3>
        <p>技術レベル：${s.level}</p>
        <p>地域：${s.area}</p>
        <button onclick="alert('弟子入り希望を送りました')">弟子入り希望を送る</button>
      `;
      results.appendChild(div);
    });
  }
</script>

</body>
</html>
